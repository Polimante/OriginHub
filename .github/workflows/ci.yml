name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (tomllib, Origin's embedded Python) and newest
        python: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Tests (pytest)
        run: pytest

  windows-app:
    name: Windows app build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"            # same as the release workflow
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app + installer, install, self-check, self-update
        # catches a plugin or data file that the frozen app cannot find, and a broken updater
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -InstallTest -UpdateTest

  no-lab-data:
    name: No measurement data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse raw data and Origin projects
        run: |
          bad=$(git ls-files | grep -iE '\.(sd|xls|xlsx|opju|opj|jws|spc|raw)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Measurement data or Origin projects must not be committed (tests generate synthetic files):"
            echo "$bad"
            exit 1
          fi
