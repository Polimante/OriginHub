name: Release

# Publishing a version: bump app/version.py, move the CHANGELOG "Unreleased" entries to a
# "## [x.y.z] - date" section, merge that PR, then push the tag:  git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow tests, builds and checks the installer, and publishes it as a GitHub Release.
# "Run workflow" (manual) does everything except publishing: the installer is kept as an artifact.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller
      - name: Version, tag and changelog agree
        id: version
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'app'); import version; print(version.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/version.py ($v)"; exit 1
          fi
          python tools/release_notes.py "$v" > release_notes.md
      - name: Lint and tests
        run: |
          ruff check .
          pytest
      - name: Build and check app + installer
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -InstallTest -UpdateTest
      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OriginHub-Setup-${{ steps.version.outputs.version }}
          path: dist/OriginHub-Setup-*
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" "dist/OriginHub-Setup-$v.exe" "dist/OriginHub-Setup-$v.exe.sha256" \
            --title "OriginHub $v" --notes-file release_notes.md
